<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Script Navigator has moved</title>
<meta name="robots" content="noindex">
<!-- This page used to hold a full standalone copy of the Script Navigator.
     The live one is now at script.ffloptimum.com, so this is a redirect only.
     Kept rather than deleted because agents have the old URL bookmarked and
     printed; deleting it would give them a 404 with nowhere to go.
     Belt and braces: meta refresh fires without JS, location.replace fires
     immediately and leaves no history entry so Back does not bounce them
     straight back here, and the visible link covers both failing. -->
<meta http-equiv="refresh" content="0; url=https://script.ffloptimum.com/">
<link rel="canonical" href="https://script.ffloptimum.com/">
<style>
  :root{--navy:#16203C;--gold:#C9A24E;--cream:#F5F1E8;--muted:#6B7280}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       padding:24px;background:var(--cream);color:var(--navy);
       font:16px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .box{max-width:460px;text-align:center;background:#fff;border:1px solid #E3DFD4;
       border-radius:16px;padding:32px 28px;box-shadow:0 2px 10px rgba(20,35,63,.06)}
  h1{margin:0 0 8px;font-size:21px;font-weight:800}
  p{margin:0 0 20px;color:var(--muted);font-size:14.5px}
  a.go{display:inline-flex;align-items:center;justify-content:center;min-height:44px;
       padding:0 22px;border-radius:10px;background:var(--navy);color:#fff;
       font-weight:700;text-decoration:none}
  a.go:hover{filter:brightness(1.15)}
  .hint{margin:16px 0 0;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
  <div class="box">
    <h1>The Script Navigator has moved</h1>
    <p>Taking you there now. If nothing happens, use the button.</p>
    <a class="go" href="https://script.ffloptimum.com/">Open the Script Navigator</a>
    <p class="hint">Update your bookmark to script.ffloptimum.com</p>
  </div>
<script>
  /* replace(), not assign() — Back should return where they came from,
     not to this page, which would redirect them forward again. */
  location.replace('https://script.ffloptimum.com/');
</script>
</body>
</html>
