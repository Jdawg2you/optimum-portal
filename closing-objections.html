<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closing Objections Cheat Sheet — moved</title>
<link rel="canonical" href="https://script.ffloptimum.com/vet/objections/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://script.ffloptimum.com/vet/objections/">
<style>
  :root{--ink:#0a1626;--paper:#f4f7fb;--gold:#c8a04a;--muted:#5b6678}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{background:var(--paper);color:var(--ink);
       font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:540px;width:100%;background:#fff;border:1px solid #e2e8f2;
        border-radius:14px;padding:30px 28px;box-shadow:0 2px 10px rgba(16,32,56,.06)}
  h1{font-size:21px;margin:0 0 10px}
  p{margin:0 0 16px;color:var(--muted)}
  a.go{display:inline-block;background:var(--gold);color:#1a1205;font-weight:700;
       text-decoration:none;padding:11px 18px;border-radius:9px}
  .alt{margin-top:20px;padding-top:16px;border-top:1px solid #eef2f8;font-size:14px}
  .alt a{color:#8a6d23;display:inline-block;margin-right:14px}
  @media (prefers-color-scheme: dark){
    body{background:#0a1626;color:#e8eef4}
    .card{background:#101f33;border-color:#24394f;box-shadow:none}
    p{color:#9fb0c4} .alt{border-top-color:#1b2e44} .alt a{color:#e8c061}
  }
</style>
</head>
<body>
  <main class="card">
    <h1>This sheet moved</h1>
    <p>The opening and closing objections are now one sheet per script. Taking you
       to the <strong>veteran / final expense</strong> one now.</p>
    <p><a class="go" href="https://script.ffloptimum.com/vet/objections/">Open it now &rarr;</a></p>
    <div class="alt">Running a different call?
      <a href="https://script.ffloptimum.com/iul/objections/">IUL objections</a>
      <a href="https://script.ffloptimum.com/mortgage/objections/">Mortgage protection objections</a>
    </div>
  </main>
  <script>location.replace('https://script.ffloptimum.com/vet/objections/');</script>
</body>
</html>
